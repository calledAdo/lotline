# Lotline's own sources: the hospital's internal database and S3-compatible object storage.
# Zetaris reaches both through host.docker.internal.
name: lotline
services:
  hospital-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: ${HOSPITAL_DB_USER}
      POSTGRES_PASSWORD: ${HOSPITAL_DB_PASSWORD}
    ports: ["127.0.0.1:55432:5432", "${HOSPITAL_DB_BIND:-0.0.0.0}:55433:5432"]
    volumes: [hospital-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hospital"]
      interval: 5s
      retries: 20
  objects:
    # SeaweedFS (Apache 2.0) as the S3-compatible store; MinIO no longer publishes images.
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"lotline","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -s3 -s3.port=9000 -s3.domainName=host.docker.internal -s3.config=/tmp/s3.json -volume.max=10 -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["9000:9000"]
    volumes: [object-data:/data]
volumes:
  hospital-data:
  object-data:
